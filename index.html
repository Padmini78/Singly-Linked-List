<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singly Linked List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Singly Linked List</h1>

        <p class="student">
            B.Sc. 3rd Semester | Padmini Khakhlary
        </p>

        <input
            type="number"
            id="value"
            placeholder="Enter value"
        >

        <div class="buttons">

            <button onclick="insertNode()">
                Insert
            </button>

            <button onclick="deleteNode()">
                Delete
            </button>

            <button onclick="searchNode()">
                Search
            </button>

            <button onclick="displayList()">
                Display
            </button>

        </div>

        <p id="message"></p>

        <h2>Current Linked List</h2>

        <div id="list">
            List is empty.
        </div>

    </div>

    <script src="script.js"></script>

</body>
  </html>
